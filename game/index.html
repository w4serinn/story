<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翠嵐と幽闇 ― 卒業までの六十週</title>
<style>
:root{
  --bg:#0f1322; --bg2:#131a2e; --panel:#171d31; --panel2:#1d2440;
  --line:#2a3354; --line2:#38426b;
  --ink:#e9e6da; --dim:#9aa0b5; --faint:#6b7290;
  --teal:#63d6b3; --violet:#ab90e8; --gold:#d6b35e; --rose:#e08373;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 500px at 85% -10%, #1c2547 0%, transparent 60%),
    radial-gradient(700px 400px at -10% 110%, #14204a33 0%, transparent 60%),
    var(--bg);
  color:var(--ink); font-family:var(--sans); line-height:1.7;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

#app{display:grid;grid-template-rows:auto 1fr;height:100vh;max-width:1180px;margin:0 auto}
header{
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  padding:14px 20px 10px;border-bottom:1px solid var(--line);
}
header h1{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.14em}
header h1 .sub{color:var(--dim);font-size:12px;letter-spacing:.22em;margin-left:10px}
#datebar{margin-left:auto;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
#datebar b{color:var(--ink);font-weight:600}

#layout{display:grid;grid-template-columns:288px 1fr;min-height:0}
aside{
  border-right:1px solid var(--line);padding:16px 18px;overflow-y:auto;
  background:linear-gradient(180deg,var(--bg2),transparent 40%);
}
.sec{margin-bottom:18px}
.sec h2{
  font-size:11px;color:var(--faint);letter-spacing:.28em;font-weight:600;
  margin-bottom:8px;text-transform:uppercase;
}
.stat{display:grid;grid-template-columns:5.4em 1fr 2.4em;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
.stat .nm{color:var(--dim)}
.stat .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--teal);transition:width .5s ease}
.bar.v i{background:var(--violet)}
.bar.g i{background:var(--gold)}
.bar.r i{background:var(--rose)}
#kouBig{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
#kouBig .n{font-size:30px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
#kouBig .t{font-size:12px;color:var(--dim)}
#fatWarn{font-size:11px;color:var(--rose);margin-top:3px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);
  color:var(--faint);letter-spacing:.04em;
}
.chip.on{color:var(--teal);border-color:#2e6b5a;background:#63d6b311}
.chip.on.v{color:var(--violet);border-color:#5d4b8c;background:#ab90e811}
.chip.on.g{color:var(--gold);border-color:#8c7a3f;background:#d6b35e11}
#resetBtn{font-size:11px;color:var(--faint);border-bottom:1px dotted var(--faint);margin-top:6px}
#resetBtn:hover{color:var(--rose);border-color:var(--rose)}

main{display:grid;grid-template-rows:1fr auto;min-height:0}
#scroll{overflow-y:auto;padding:26px 34px 10px;scroll-behavior:smooth}
#log{max-width:62ch;margin:0 auto}
.pr{font-family:var(--serif);font-size:15.5px;line-height:2.05;margin:0 0 16px;letter-spacing:.02em;animation:fade .5s ease}
.pr.dim{color:var(--dim);font-size:13.5px}
.pr.delta{
  font-family:var(--sans);font-size:12.5px;line-height:1.6;color:var(--dim);
  border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:14px 0 20px;
}
.up{color:var(--teal)} .upv{color:var(--violet)} .upg{color:var(--gold)} .dn{color:var(--rose)}
.pr.divider{
  font-family:var(--sans);display:flex;align-items:center;gap:12px;
  color:var(--faint);font-size:11.5px;letter-spacing:.2em;margin:34px 0 18px;
}
.pr.divider::before,.pr.divider::after{content:"";height:1px;background:var(--line);flex:1}
.pr.divider .wk{color:var(--teal)}
.pr.ev{
  font-family:var(--sans);font-size:12px;letter-spacing:.24em;color:var(--gold);
  margin:6px 0 14px;
}
.pr.result{font-family:var(--sans);font-size:13px;letter-spacing:.1em}
.pr.result.win{color:var(--teal)} .pr.result.lose{color:var(--rose)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pr{animation:none}.bar i{transition:none}}

#choices{
  border-top:1px solid var(--line);padding:14px 34px 18px;
  display:grid;gap:8px;max-height:44vh;overflow-y:auto;
  background:linear-gradient(0deg,var(--bg2),transparent);
}
#choices .inner{max-width:62ch;margin:0 auto;width:100%;display:grid;gap:8px}
.ch{
  text-align:left;padding:10px 16px;border:1px solid var(--line2);border-radius:6px;
  background:var(--panel);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;gap:1px;transition:border-color .15s,background .15s;
}
.ch:hover{border-color:var(--teal);background:var(--panel2)}
.ch small{color:var(--faint);font-size:11.5px;letter-spacing:.04em}
.ch.sub2{grid-template-columns:1fr}

#title{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 480px at 70% 20%, #20294e 0%, transparent 65%),
    radial-gradient(circle 110px at 72% 24%, #e9e6da14 0%, transparent 100%),
    var(--bg);
}
#title .box{text-align:center;padding:24px}
#title .kicker{font-size:12px;letter-spacing:.5em;color:var(--dim);margin-bottom:18px}
#title h1{
  font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,46px);
  letter-spacing:.18em;text-wrap:balance;line-height:1.5;
}
#title h1 .a{color:var(--teal)} #title h1 .b{color:var(--violet)}
#title .lead{
  font-family:var(--serif);color:var(--dim);font-size:14px;line-height:2.2;
  margin:26px 0 34px;letter-spacing:.06em;
}
#title .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#title .btns button{
  font-size:14px;letter-spacing:.24em;padding:11px 34px;border:1px solid var(--line2);
  border-radius:4px;background:var(--panel);transition:border-color .15s;
}
#title .btns button:hover{border-color:var(--teal)}
#title .btns button.primary{border-color:var(--teal);color:var(--teal)}
#title .note{margin-top:22px;font-size:11px;color:var(--faint);letter-spacing:.12em}

@media (max-width:820px){
  #layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:none;border-bottom:1px solid var(--line);max-height:34vh}
  aside .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  #scroll{padding:20px 18px 8px}
  #choices{padding:12px 18px 14px}
}
</style>
</head>
<body>

<div id="title">
  <div class="box">
    <div class="kicker">王立魔法学園 育成シミュレーション</div>
    <h1><span class="a">翠嵐</span>と<span class="b">幽闇</span><br>― 卒業までの六十週 ―</h1>
    <p class="lead">卒業までに、王国が認める功績を。<br>それが、セリアの父と交わした約束だった。</p>
    <div class="btns">
      <button class="primary" id="btnNew">はじめから</button>
      <button id="btnCont" style="display:none">続きから</button>
    </div>
    <p class="note">五角形を鍛え、絆を深め、六十週後の卒業式でグレンの答えを聞く</p>
  </div>
</div>

<div id="app">
  <header>
    <h1>翠嵐と幽闇<span class="sub">卒業までの六十週</span></h1>
    <div id="datebar"></div>
  </header>
  <div id="layout">
    <aside>
      <div class="grid2">
      <div class="sec">
        <h2>功績</h2>
        <div id="kouBig"><span class="n" id="kouN">0</span><span class="t">/ 目標75</span></div>
        <div class="bar g"><i id="kouBar"></i></div>
      </div>
      <div class="sec">
        <h2>五角形</h2>
        <div id="pent"></div>
      </div>
      <div class="sec">
        <h2>学園と絆</h2>
        <div id="soft"></div>
      </div>
      <div class="sec">
        <h2>疲労</h2>
        <div class="stat"><span class="nm">疲労</span><span class="bar r"><i id="fatBar"></i></span><span class="val" id="fatN">0</span></div>
        <div id="fatWarn">限界が近い。休息を。</div>
      </div>
      <div class="sec">
        <h2>修得の証</h2>
        <div class="chips" id="marks"></div>
      </div>
      <div class="sec">
        <button id="resetBtn">最初からやり直す</button>
      </div>
      </div>
    </aside>
    <main>
      <div id="scroll"><div id="log"></div></div>
      <div id="choices"><div class="inner" id="chInner"></div></div>
    </main>
  </div>
</div>

<script>
"use strict";
/* ================= util ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SAVE_KEY="suiran_yuan_save_v1";

/* ================= state ================= */
let S=null;
function newState(){return{
  week:1,
  st:{mar:55,waza:62,han:40,tai:50,joho:40},
  gaku:68,kizuna:70,sync:30,kou:0,fat:20,
  flags:{},tWins:0
};}
const STATS=[
  ["mar","魔力量"],["waza","技の精度"],["han","判断力"],["tai","体力"],["joho","情報収集"]
];

/* ================= render ================= */
function renderStatus(){
  $("pent").innerHTML=STATS.map(([k,n])=>
    `<div class="stat"><span class="nm">${n}</span><span class="bar"><i style="width:${S.st[k]}%"></i></span><span class="val">${S.st[k]}</span></div>`).join("");
  $("soft").innerHTML=
    `<div class="stat"><span class="nm">学業</span><span class="bar"><i style="width:${S.gaku}%"></i></span><span class="val">${S.gaku}</span></div>`+
    `<div class="stat"><span class="nm">セリアとの絆</span><span class="bar v"><i style="width:${S.kizuna}%"></i></span><span class="val">${S.kizuna}</span></div>`+
    `<div class="stat"><span class="nm">連携</span><span class="bar v"><i style="width:${S.sync}%"></i></span><span class="val">${S.sync}</span></div>`;
  $("kouN").textContent=S.kou;
  $("kouBar").style.width=clamp(S.kou,0,100)+"%";
  $("fatN").textContent=S.fat;
  $("fatBar").style.width=clamp(S.fat,0,100)+"%";
  $("fatWarn").style.display=S.fat>=75?"block":"none";
  const marks=[
    ["風の感知・全周",S.st.joho>=70,""],
    ["判断の型",S.st.han>=70,""],
    ["翠嵐・第三回路",S.st.waza>=88,""],
    ["媒介なき闇・安定",S.sync>=70,"v"],
    ["武闘会優勝",!!S.flags.champ,"g"],
    ["光牙",!!S.flags.kouga,"g"],
  ];
  $("marks").innerHTML=marks.map(([n,on,c])=>`<span class="chip ${on?("on "+c):""}">${n}</span>`).join("");
  const w=Math.min(S.week,60);
  $("datebar").innerHTML=S.week>60
    ?`<b>最終週</b>　卒業式`
    :`<b>第${w}週</b>　${dateLabel(w)}　／　卒業まで残り <b>${60-w}</b> 週`;
}
function dateLabel(w){
  const m=1+Math.floor((w-1)/4), wk=((w-1)%4)+1;
  const grade=m<=3?"3年生":"4年生";
  const month=m<=12?m:m-12;
  return `${grade}・${month}月 第${wk}週`;
}
function seasonOf(w){
  const m0=1+Math.floor((w-1)/4); const m=m0<=12?m0:m0-12;
  if(m<=2||m===12)return"冬"; if(m<=5)return"春"; if(m<=8)return"夏"; return"秋";
}

/* ================= log ================= */
const logEl=()=>$("log");
function p(html,cls=""){
  const el=document.createElement("p");
  el.className="pr"+(cls?" "+cls:"");
  el.innerHTML=html;
  logEl().appendChild(el);
  const sc=$("scroll"); sc.scrollTop=sc.scrollHeight;
}
function delta(parts){ p(parts.join("　"),"delta"); }
function up(n,v){return `<span class="up">${n} +${v}</span>`}
function upv(n,v){return `<span class="upv">${n} +${v}</span>`}
function upg(n,v){return `<span class="upg">${n} +${v}</span>`}
function dn(n,v){return `<span class="dn">${n} ${v>0?"+":""}${v}</span>`}
function choose(list){
  const box=$("chInner"); box.innerHTML="";
  list.forEach(c=>{
    const b=document.createElement("button");
    b.className="ch";
    b.innerHTML=`<span>${c.label}</span>`+(c.sub?`<small>${c.sub}</small>`:"");
    b.onclick=()=>{box.innerHTML="";c.fn();};
    box.appendChild(b);
  });
  const sc=$("scroll"); sc.scrollTop=sc.scrollHeight;
}

/* ================= gains ================= */
function gainStat(k,amt){
  const cur=S.st[k];
  const eff=Math.max(1,Math.round(amt*(118-cur)/88));
  S.st[k]=clamp(cur+eff,0,100);
  return eff;
}
function addFat(n){S.fat=clamp(S.fat+n,0,110);}
function addKou(n){S.kou=clamp(S.kou+n,0,999);}

/* ================= save ================= */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=localStorage.getItem(SAVE_KEY);return d?JSON.parse(d):null;}catch(e){return null;}}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

/* ================= flavor pools ================= */
const SEASON_LINES={
  "冬":["朝の訓練場に、白い息が並んでいた。","窓の外で、粉雪が街灯の光を掠めていく。","談話室の暖炉が、パチリと爆ぜた。"],
  "春":["中庭の魔素桜が、青白い光を散らしている。","開け放した窓から、湿った土の匂いがした。","新入生の声が、廊下の向こうで弾んでいた。"],
  "夏":["訓練場の石畳が、昼前から熱を持ち始める。","蝉の声に混じって、ヴィクターの掛け声が響く。","食堂の冷えた果実水が、いつもより早く売り切れた。"],
  "秋":["学園の並木が、赤く染まり始めていた。","収穫祭の準備で、街全体が浮き足立っている。","夜の見回りの灯りが、落ち葉を照らしていた。"]
};
const FRIEND_SCENES=[
  {t:`ミラが片耳の魔導具を外して振り返った。「デューク君〜、聞いたよ〜。最近セリアが楽しそうなんだよね〜」<br>「な、何が」<br>「ふーん、そうなんだ〜」<br>ミラはにやにやしたまま、それ以上は言わなかった。`,fx:()=>[dm("kizuna",2,"絆")]},
  {t:`工房から金属を叩く音がしていた。カイデンが顔も上げずに言う。「ちょうどいいとこ来たな。ちょっとこれ持ってろ」<br>渡された魔導具は、ほんのり温かかった。「増幅器の改良版。今度の実戦で試させてくれよ」<br>「当然だろ、仲間じゃん」`,fx:()=>[dm("joho",2,"情報収集")]},
  {t:`「……構造、読む」<br>ヨルゲンと二人、図書館で遺跡の図面を広げた。寡黙な相棒の指が、迷いなく一点を差す。デュークのノートが、また一頁埋まった。`,fx:()=>[dm("han",2,"判断力")]},
  {t:`「デューク！走るぞ！」<br>ヴィクターの声に引きずられて、朝の外周を三周。終わる頃には膝が笑っていたが、悪くない疲れだった。`,fx:()=>[dm("tai",3,"体力")]},
  {t:`「新しい火加減、見ててほしいっす！」<br>ソラの杖の先で、火球が綺麗な球形を保っていた。「一気にやらず、少しずつ、っす」<br>その言葉は、自分の魔力管理にもそのまま刺さった。`,fx:()=>[dm("mar",2,"魔力量")]},
  {t:`「まあ、ちょうどよかったですわ」<br>エアラが古代文字の写しを差し出した。「この一節、風と雷の記述ですのよ。あなたの武器の参考になるかと思って」<br>紅茶の香りの中で、解読は夜まで続いた。`,fx:()=>[dm("waza",2,"技の精度")]},
  {t:`「デューク様、お疲れのようですわ」<br>中庭でリリアナに呼び止められ、回復魔法をかけてもらった。ほのかに温かい水の魔力が、肩の重さを流していく。`,fx:()=>{S.fat=clamp(S.fat-12,0,110);return[`<span class="up">疲労 -12</span>`];}},
];
function dm(k,amt,label){const e=gainStat(k,amt);return up(label,e);}
const DATE_SCENES=[
  `高台の公園には、今日も二人以外に誰もいなかった。<br>「ここ、やっぱり一番好き」<br>セリアの影が、ベンチの下でゆっくり揺れている。デュークはそれに気づいて、何も言わずに肩を寄せた。`,
  `カフェ・ブルームの窓際の席。セリアはローストビーフサンドを半分に割って、当然のように片方を寄越した。<br>「……半分こ」<br>「ありがと」<br>影が机の脚で、嬉しそうに跳ねた。`,
  `植物園の温室は、霧のむこうに夜光花が灯っていた。<br>「綺麗だね」<br>「……うん」<br>セリアの返事は短かったが、繋いだ手は離れなかった。`,
  `図書館の隅で、二冊の本を並べて読んだ。ページをめくる音だけの時間。ふと顔を上げると、セリアがこちらを見ていて、慌てて視線を落とした。耳が赤かった。`,
  `商店街の帰り道、セリアが立ち止まった。「……これ」<br>差し出されたのは、小さな焼き菓子の包みだった。「試作。ミラに教わった」<br>甘さは少し不揃いで、だからこそ美味しかった。`
];
const QUEST_SCENES=[
  {t:"王国調査隊から、近郊遺跡の予備調査の依頼が届いた。エリカの署名がある。「いつでも歓迎する」の言葉どおりに。",win:"マーカーの配置、魔物の痕跡の記録、構造のスケッチ。報告書は「客観的に、正確に、分かりやすく」。ルイスが口笛を吹いた。「お前、本当に学生か？」",lose:"地下二層で判断が遅れ、撤退が半日ずれた。エリカの講評は短かった。「帰るまでが調査よ」"},
  {t:"騎士隊から、王都外周の警邏補助の要請があった。ガレス連隊長の許可印つきの、正式な依頼だった。",win:"風の感知が、路地裏の異変を先に拾った。密売人二人を騎士隊に引き渡し、調書に名前が残った。",lose:"追跡の途中で見失った。ラルフ・ディートリヒの目が言っていた。──詰めが甘い。"},
  {t:"図書館から、閉架の古代文献の整理と目録化の依頼。エドヴィン・クラウス博士の推薦だという。",win:"崩れかけた巻物から、遺跡の未記載の間取りを発見した。博士は目を細めた。「君は、いい目をしている」",lose:"解読に手間取り、目録は半分で期限が来た。成果としては、弱い。"}
];

/* ================= week engine ================= */
function weekHeader(){
  p(`<span class="wk">第${S.week}週</span><span>${dateLabel(S.week)}</span>`,"divider");
}
function startWeek(){
  renderStatus();
  weekHeader();
  const ev=EVENTS[S.week];
  if(ev){ev();}
  else{
    p(pick(SEASON_LINES[seasonOf(S.week)]),"dim");
    actionMenu();
  }
}
function endWeek(){
  S.week++;
  renderStatus(); save();
  if(S.week>60){ending();return;}
  if(S.fat>=100){
    weekHeader();

/* ================= battle ================= */
function milestoneBonus(kind){
  let b=0,notes=[];
  if(kind==="attack"&&S.st.waza>=88){b+=6;notes.push("翠嵐・第三回路");}
  if(kind==="read"&&S.st.joho>=70){b+=5;notes.push("風の感知・全周");}
  if(kind==="read"&&S.st.han>=70){b+=4;notes.push("判断の型");}
  if(kind==="pair"&&S.sync>=70){b+=7;notes.push("媒介なき闇・安定");}
  return{b,notes};
}
function battle(cfg,after){
  p(`◆ ${cfg.title}`,"ev");
  p(cfg.intro);
  const mk=(label,sub,kind,base,text,extra=0)=>({label,sub,fn:()=>{
    const ms=milestoneBonus(kind);
    const roll=rnd(-8,14);
    const total=base+ms.b+extra+roll;
    p(text);
    if(ms.notes.length)p(`──${ms.notes.join("、")}が、静かに効いている。`,"dim");
    const win=total>=cfg.diff;
    if(win){
      p(cfg.win);
      p("勝利","result win");
    }else{
      p(cfg.lose);
      p("敗北──だが、命はある。カグラの声が耳の奥で響く。「悔しいなら、次で返せ」","result lose");
      addFat(25);
    }
    after(win);
  }});
  const atk=S.st.waza*0.5+S.st.mar*0.3+S.st.tai*0.2;
  const rd =S.st.joho*0.45+S.st.han*0.35+S.st.waza*0.2;
  const pr =S.sync*0.45+S.st.waza*0.25+S.kizuna*0.3;
  choose([
    mk("攻める ― 紫電清嵐","技の精度・魔力量・体力で押し切る","attack",atk,
      "迷いは捨てた。腰を落とし、鯉口を切る。紫の電光が、抜刀と同時に迸った。",cfg.atkBonus||0),
    mk("見極める ― 風の感知","情報収集・判断力で崩す","read",rd,
      "風を薄く、広く。相手の魔力の流れ、予備動作、属性の切り替わり──その一瞬の隙を待つ。",cfg.readBonus||0),
    mk("セリアと連携する","連携・絆で二人の力を重ねる","pair",pr,
      "視線だけで通じた。影が地を這い、重力が敵の足を掴む。デュークの風が、その一拍あとに吹き抜けた。",cfg.pairBonus||0),
  ]);
}

/* ================= ending ================= */
function ending(){
  renderStatus();
  p(`<span class="wk">最終週</span><span>卒業式</span>`,"divider");
  p("◆ 卒業式","ev");
  p(`講堂に、春の光が差し込んでいる。首席答辞を読み終えたデュークの声が、まだ壁に残っているようだった。<br>式のあと、校門の前に、グレン・クロウヴァルが立っていた。`);
  const k=S.kou,z=S.kizuna;
  let title,body,rank;
  if(k>=90&&z>=85&&S.flags.kouga){
    title="真結末　―　光牙と翠嵐";
    body=`グレンは深く、頭を下げた。<br>「娘を──セリアを、頼む」<br>没落貴族の当主が平民の青年に頭を下げる。その意味の重さごと、デュークは受け取った。「はい。必ず」<br><br>春の風の中、セリアの腰には二振りの短剣がある。影喰と、光牙。失われた対は揃い、二人の隣には、王国が認めた功績と、誰にも認めさせる必要のない絆があった。<br>「……行こう、デューク」<br>「うん」<br>王国調査隊の採用通知を胸に、二人は同じ方向へ歩き出した。おじいちゃんになっても見たい景色は、もう隣にあった。`;
    rank=`功績 ${k}／絆 ${z}　─　完璧な六十週`;
  }else if(k>=75&&z>=75){
    title="約束の功績";
    body=`「……約束は、約束だ」<br>グレンはそう言って、初めてデュークに右手を差し出した。「娘のこと、認めよう」<br>握った手は、思ったよりずっと硬く、少し震えていた。<br>隣でセリアの影が、これ以上ないほど大きく跳ねて──本人は、無表情のまま泣いていた。`;
    rank=`功績 ${k}／絆 ${z}　─　約束は果たされた`;
  }else if(k>=75){
    title="認められた力";
    body=`「功績は、認める」<br>グレンの言葉に、しかし続きがあった。「だが、娘の隣に立つのは力だけではないぞ」<br>足りなかったのは、二人の時間だったのかもしれない。それでも道は開けた。ここからは、功績ではなく、心を積む番だ。`;
    rank=`功績 ${k}／絆 ${z}　─　次は、二人の時間を`;
  }else if(k>=45){
    title="五年の誓い";
    body=`「……まだ、足りぬ」<br>グレンの答えは変わらなかった。だがデュークは、まっすぐに顔を上げた。「祖父は、五年かけて認めさせました。俺も、何年でも」<br>横で、セリアがはっきりと言った。「私も、待たない。一緒に積む」<br>ライアンと祖母の物語を、今度は二人がなぞっていく。終わりではなく、続きだった。`;
    rank=`功績 ${k}／絆 ${z}　─　物語は続く`;
  }else{
    title="それでも、隣に";
    body=`功績は、届かなかった。縁談の話が、再びクロウヴァル家の食卓に載るだろう。<br>それでも、帰り道の高台の公園で、セリアは言った。「私の答えは、変わらないって言った」<br>影が、夕陽の中で静かに、強く伸びていた。負けたのは約束であって、二人ではない。`;
    rank=`功績 ${k}／絆 ${z}　─　再挑戦を`;
  }
  p(`── ${title} ──`,"ev");
  p(body);
  p(rank,"result "+(k>=75?"win":"lose"));
  const recap=[];
  if(S.flags.champ)recap.push("武闘会優勝");
  if(S.flags.kouga)recap.push("光牙の発見");
  if(S.st.waza>=88)recap.push("翠嵐・第三回路の覚醒");
  if(S.sync>=70)recap.push("媒介なき闇の安定");
  if(recap.length)p(`この六十週の記録：${recap.join("／")}`,"dim");
  wipe();
  choose([
    {label:"もう一度、六十週を",sub:"最初からやり直す",fn:()=>{location.reload();}},
  ]);
}

/* ================= boot ================= */
function boot(fresh){
  $("title").style.display="none";
  logEl().innerHTML="";
  if(fresh){S=newState();}
  renderStatus();
  if(!fresh){
    p(`──記録を読み込んだ。第${S.week}週、${dateLabel(S.week)}から再開する。`,"dim");
  }
  startWeek();
}
$("btnNew").onclick=()=>{wipe();boot(true);};
const saved=load();
if(saved&&saved.week&&saved.week<=60){
  $("btnCont").style.display="";
  $("btnCont").onclick=()=>{S=saved;boot(false);};
}
$("resetBtn").onclick=()=>{
  if(confirm("最初からやり直しますか？（記録は消えます）")){wipe();location.reload();}
};
</script>
